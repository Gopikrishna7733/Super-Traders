<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Traders: Live Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo-chip"><img src="logo.png" alt="PMM 3.0"></div>
  <div class="brand">
    <h1>Super Traders</h1>
    <p>The Knowledge Stock Market</p>
  </div>
  <div class="spacer"></div>
  <span id="status" class="pill"></span>
  <button class="btn ghost sm" id="fs" type="button">Full screen</button>
</header>
<div id="statusline" class="statusline"></div>

<main class="stage">
  <section class="board">
    <div class="qhead"><span id="qno"></span><span id="mode"></span></div>
    <h2 id="question" class="question"></h2>
    <ol class="opts" id="opts"></ol>

    <div class="ticker">
      <div id="raise" class="raise" role="status" aria-live="polite" hidden></div>
      <div class="row" style="align-items:flex-end;gap:1.2rem">
        <div class="price idle num" id="price">0</div>
        <div style="flex:0 0 auto;padding-bottom:1rem">
          <div class="unit">points</div>
          <div class="trend" id="trend"></div>
        </div>
        <div class="leader" id="leader" hidden><small id="leaderLabel">Highest bidder</small><b id="leaderName"></b></div>
      </div>
      <div id="clockwrap" hidden>
        <div class="clock-label" id="clocklabel"></div>
        <div class="bar" id="bar"><i id="barfill"></i></div>
      </div>
    </div>

    <ol class="feed" id="feed" aria-label="Bid history"></ol>
    <div class="chart" id="chart"></div>
    <div id="banner" class="banner" hidden></div>
  </section>

  <aside class="panel">
    <h2>Portfolio standings</h2>
    <ol class="ranks" id="ranks"></ol>
  </aside>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let prevPrice = null, prevRev = null, prevQ = null, prevBids = 0, prevLeader = null, raiseTimer = null, lastRanks = '';

Store.onStatus((kind, msg) => { const el = $('statusline'); el.textContent = msg; el.className = 'statusline' + (kind === 'error' ? ' error' : ''); });
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

function render(s) {
  const m = s.market, info = UI.phaseInfo(s);
  const st = $('status'); st.className = 'pill ' + info.cls; st.innerHTML = '<span class="dot"></span>' + UI.esc(info.label);
  $('qno').textContent = m.qNo ? 'Question ' + m.qNo : 'Market not open yet';
  $('mode').innerHTML = m.phase !== 'idle' && m.qNo ? '<span class="chip">' + UI.esc(UI.typeLabel(m.qType)) + '</span>' : '';
  $('opts').innerHTML = UI.optionsHTML(m);
  $('question').textContent = m.phase === 'idle' ? 'The next question is about to hit the market.' : (m.question || 'The quiz master is reading the question.');

  // price + trend
  const p = $('price');
  if (m.phase === 'idle') { p.textContent = '0'; p.className = 'price idle num'; }
  else {
    p.textContent = UI.fmt(m.price); p.className = 'price num';
    if (prevPrice !== null && m.price !== prevPrice && m.rev !== prevRev) { void p.offsetWidth; p.classList.add(m.price > prevPrice ? 'flash-up' : 'flash-down'); }
  }
  prevPrice = m.phase === 'idle' ? null : m.price; prevRev = m.rev;
  const h = m.history, tr = $('trend');
  if (m.phase !== 'idle' && h.length > 1 && h[h.length - 1] !== h[h.length - 2]) {
    const d = h[h.length - 1] - h[h.length - 2];
    tr.className = 'trend ' + (d > 0 ? 'up' : 'down'); tr.textContent = (d > 0 ? '▲ +' : '▼ −') + Math.abs(d);
  } else { tr.className = 'trend'; tr.textContent = ''; }

  $('chart').innerHTML = UI.chartSVG(m.phase === 'idle' ? [] : h, m.labels);

  // who is bidding: leader card, "raised the bid" announcement and bid feed
  const ev = m.phase === 'idle' ? [] : UI.bidEvents(m), lastEv = ev[ev.length - 1];
  const ld = $('leader');
  if (lastEv) {
    ld.hidden = false;
    $('leaderLabel').textContent = m.phase === 'bidding' ? 'Highest bidder' : m.phase === 'answering' ? 'Owner, answering now' : 'Sold to';
    $('leaderName').textContent = lastEv.name;
    if (prevLeader !== null && prevLeader !== lastEv.name + lastEv.price) { ld.classList.remove('pop'); void ld.offsetWidth; ld.classList.add('pop'); }
    prevLeader = lastEv.name + lastEv.price;
  } else { ld.hidden = true; prevLeader = null; }
  const rz = $('raise');
  if (prevQ === m.qNo && ev.length > prevBids && m.phase === 'bidding' && lastEv) {
    rz.textContent = lastEv.first ? lastEv.name + ' bought the question at ' + UI.fmt(lastEv.price) : '▲ ' + lastEv.name + ' raised the bid to ' + UI.fmt(lastEv.price) + ' (+' + UI.fmt(lastEv.delta) + ')';
    rz.hidden = false; rz.style.animation = 'none'; void rz.offsetWidth; rz.style.animation = '';
    clearTimeout(raiseTimer); raiseTimer = setTimeout(() => { rz.hidden = true; }, 4000);
  }
  if (m.phase !== 'bidding') { rz.hidden = true; }
  prevQ = m.qNo; prevBids = ev.length;
  $('feed').innerHTML = ev.slice(-5).reverse().map((e, i) => `<li class="${i === 0 ? 'new' : ''}"><b>${UI.esc(e.name)}</b> ${e.first ? 'bought at' : 'raised to'} ${UI.fmt(e.price)}${!e.first && e.delta ? ' (+' + UI.fmt(e.delta) + ')' : ''}</li>`).join('');

  // owner / result banner
  const b = $('banner'), owner = s.teams.find(t => t.id === m.ownerId);
  b.className = 'banner'; b.hidden = false;
  if (m.phase === 'bidding') { b.classList.add('owner'); b.textContent = 'Highest bidder: ' + (owner ? owner.name : 'a team') + ' at ' + UI.fmt(m.price); }
  else if (m.phase === 'answering') { b.classList.add('owner'); b.textContent = (owner ? owner.name : 'A team') + ' owns this question at ' + UI.fmt(m.price) + (m.submitted ? ' and has locked in an answer.' : ' and must answer now'); }
  else if (m.phase === 'result' && m.result) {
    const ans = m.result.answer ? ' Correct answer: ' + m.result.answer + '.' : '';
    const gv = m.result.given ? ' Answered: ' + m.result.given + '.' : '';
    if (m.result.skipped) b.textContent = 'Question skipped. No points changed.' + ans;
    else if (m.result.correct) { b.classList.add('win'); b.textContent = m.result.teamName + ' answered correctly: profit of ' + UI.fmt(m.result.delta) + ' points (2× ' + UI.fmt(m.result.price) + ').' + gv + ans; }
    else { b.classList.add('lose'); b.textContent = m.result.teamName + ' answered incorrectly: loss of ' + UI.fmt(-m.result.delta) + ' points.' + gv + ans; }
  } else if (m.phase === 'open') b.textContent = 'No owner yet. Buy now before the price falls further, or wait for it to drop.';
  else b.hidden = true;

  // standings (only redrawn when something changed, so the podium animations keep running)
  const html = UI.standingsHTML(s, { showOwner: true });
  if (html !== lastRanks) { lastRanks = html; $('ranks').innerHTML = html; }
}

function tick() {
  const s = Store.state(); if (!s) return;
  const t = Store.secondsLeft(), m = s.market, w = $('clockwrap');
  if (!t) { w.hidden = true; return; }
  w.hidden = false;
  const secs = Math.ceil(t.left); let label, frac = t.left / t.total;
  if (m.phase === 'open') {
    if (m.price <= s.settings.floor) { label = 'Price is at the floor. Waiting for a buyer.'; frac = 0; }
    else label = 'Next price drop in ' + secs + 's';
  } else if (m.phase === 'bidding') label = 'Market closes in ' + secs + 's unless someone outbids';
  else label = t.left > 0 ? 'Time to answer: ' + secs + 's' : "Time's up";
  $('clocklabel').textContent = label;
  $('barfill').style.width = (frac * 100) + '%';
  $('bar').classList.toggle('warn', m.phase !== 'open' && t.left <= 5);
}

Store.subscribe(render);
setInterval(tick, 150);
</script>
</body>
</html>
