<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Traders: Team Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo-chip"><img src="logo.png" alt="PMM 3.0"></div>
  <div class="brand">
    <h1>Super Traders</h1>
    <p>Analyse the risk, invest your points, maximise your profit.</p>
  </div>
</header>
<div id="statusline" class="statusline"></div>

<main class="wrap">
  <!-- pick a team -->
  <section class="panel" id="picker" hidden>
    <h2>Choose your team</h2>
    <div class="field">
      <label for="teamSelect">Team name</label>
      <select id="teamSelect"></select>
    </div>
    <button class="btn gold big" id="enter" type="button">Enter the market</button>
    <p class="muted small" style="margin-top:.8rem">Pick carefully. Your team gets locked to this device once you enter.</p>
    <p class="msg" id="pickMsg" style="margin-top:.4rem"></p>
    <p class="muted small" id="noTeams" hidden></p>
  </section>

  <!-- trading desk -->
  <section id="desk" hidden>
    <div class="panel" style="margin-bottom:1rem">
      <div class="capital"><span id="teamName" style="font-weight:600"></span><span class="muted small">Trading capital</span></div>
      <div class="capital"><span class="muted small" style="max-width:15rem">Locked to this device. To change teams, ask the admin.</span><b id="capital">0</b></div>
    </div>

    <div class="panel" style="display:grid;gap:1rem">
      <div class="row" style="justify-content:space-between"><span id="phase" class="pill"></span><span class="muted small" id="qno"></span></div>
      <div><span class="chip" id="qtype" hidden></span></div>
      <p id="question" style="font-weight:600;font-size:1.15rem"></p>
      <ol class="opts" id="opts"></ol>
      <div class="row" style="align-items:flex-end">
        <div class="team-price" id="price">0</div>
        <div class="muted" style="flex:0 0 auto;padding-bottom:.4rem">points <span id="trend" class="trend"></span></div>
      </div>
      <div id="clockwrap" hidden>
        <div class="clock-label small" id="clocklabel"></div>
        <div class="bar" id="bar"><i id="barfill"></i></div>
      </div>

      <div id="banner" class="banner" hidden></div>

      <!-- actions -->
      <div id="buyBox" hidden>
        <button class="btn gold big" id="buy" type="button"></button>
      </div>
      <div id="bidBox" hidden style="display:grid;gap:.7rem">
        <button class="btn bull big" id="quickBid" type="button"></button>
        <div class="row">
          <input id="custom" type="number" inputmode="numeric" min="1" step="1" placeholder="Your own bid" aria-label="Your own bid">
          <button class="btn" id="customBtn" type="button">Place bid</button>
        </div>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>

    <div class="panel" style="margin-top:1rem">
      <h2>Standings</h2>
      <ol class="ranks" id="ranks"></ol>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'superTraders:team';
let myId = localStorage.getItem(KEY);
let deviceId = localStorage.getItem('superTraders:device');
if (!deviceId) { deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('superTraders:device', deviceId); }
let pickerFilled = '';
let prevPrice = null;

Store.onStatus((kind, msg) => { const el = $('statusline'); el.textContent = msg; el.className = 'statusline' + (kind === 'error' ? ' error' : ''); });

function say(text, ok) { const m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (ok ? ' ok' : ''); }

async function bid(amount) {
  say('');
  const r = await Store.actions.placeBid(myId, amount);
  if (r.error) say(r.error === 'stale' ? 'The market moved. Try again.' : r.error);
  else say('Bid placed at ' + UI.fmt(r.price), true);
}

$('enter').onclick = async () => {
  const v = $('teamSelect').value; if (!v) return;
  const name = $('teamSelect').selectedOptions[0].textContent;
  if (!confirm('Join as "' + name + '"? This locks the team to this device, and only the admin can change it.')) return;
  $('pickMsg').textContent = '';
  const r = await Store.actions.claimTeam(v, deviceId);
  if (r.error) { $('pickMsg').textContent = r.error; return; }
  myId = v; localStorage.setItem(KEY, v); render(Store.state());
};
$('buy').onclick = () => bid();
$('quickBid').onclick = () => { const s = Store.state(); bid(s.market.price + s.settings.step); };
$('customBtn').onclick = () => { const v = $('custom').value; if (!v) return say('Type the amount you want to bid.'); bid(v); $('custom').value = ''; };
$('custom').addEventListener('keydown', e => { if (e.key === 'Enter') $('customBtn').click(); });

function render(s) {
  const me = s.teams.find(t => t.id === myId && t.claimedBy === deviceId);
  if (!me) { // show picker (also when the admin unlocked or removed this team)
    if (myId) { myId = null; localStorage.removeItem(KEY); }
    $('desk').hidden = true; $('picker').hidden = false;
    const free = s.teams.filter(t => !t.claimedBy);
    const key = free.map(t => t.id + t.name).join('|');
    if (key !== pickerFilled) {
      pickerFilled = key;
      $('teamSelect').innerHTML = free.map(t => `<option value="${UI.esc(t.id)}">${UI.esc(t.name)}</option>`).join('');
    }
    $('noTeams').hidden = free.length > 0; $('enter').disabled = !free.length;
    $('noTeams').textContent = s.teams.length ? 'All teams are taken. If yours is locked on another device, ask the admin.' : 'No teams yet. Ask the quiz master to add teams, then reload this page.';
    return;
  }
  $('picker').hidden = true; $('desk').hidden = false;
  const m = s.market, st = s.settings, info = UI.phaseInfo(s);
  $('teamName').textContent = me.name;
  $('capital').textContent = UI.fmt(me.points);
  const ph = $('phase'); ph.className = 'pill ' + info.cls; ph.innerHTML = '<span class="dot"></span>' + UI.esc(info.label);
  $('qno').textContent = m.qNo ? 'Question ' + m.qNo : '';
  const qt = $('qtype'); qt.hidden = m.phase === 'idle' || !m.qNo; qt.textContent = UI.typeLabel(m.qType);
  $('opts').innerHTML = UI.optionsHTML(m);
  $('question').textContent = m.phase === 'idle' ? 'Waiting for the quiz master to open the next question.' : (m.question || 'Listen to the quiz master.');

  const p = $('price');
  p.textContent = m.phase === 'idle' ? '0' : UI.fmt(m.price);
  p.style.color = m.phase === 'idle' ? 'var(--line)' : '';
  const h = m.history, tr = $('trend');
  if (m.phase !== 'idle' && h.length > 1) { const d = h[h.length - 1] - h[h.length - 2]; tr.className = 'trend ' + (d > 0 ? 'up' : 'down'); tr.textContent = (d > 0 ? '▲ +' : '▼ −') + Math.abs(d); }
  else { tr.className = 'trend'; tr.textContent = ''; }

  const iLead = m.ownerId === myId, owner = s.teams.find(t => t.id === m.ownerId);
  const b = $('banner'); b.className = 'banner'; b.hidden = false;
  $('buyBox').hidden = true; $('bidBox').hidden = true;

  if (m.phase === 'open') {
    b.textContent = 'No owner yet. The price keeps falling until a team buys.';
    $('buyBox').hidden = false;
    $('buy').textContent = 'Buy at ' + UI.fmt(m.price);
    $('buy').disabled = me.points < m.price;
    if (me.points < m.price) say('Your capital (' + UI.fmt(me.points) + ') is below the price.');
  } else if (m.phase === 'bidding') {
    $('bidBox').hidden = false;
    const next = m.price + st.step, can = me.points >= next;
    if (iLead) { b.classList.add('owner'); b.textContent = 'You hold the highest bid at ' + UI.fmt(m.price) + '. Hold on until the market closes.'; }
    else b.textContent = owner.name + ' leads at ' + UI.fmt(m.price) + '. Outbid them or let it go.';
    $('quickBid').textContent = 'Bid ' + UI.fmt(next);
    $('quickBid').disabled = iLead || !can; $('customBtn').disabled = iLead || !can; $('custom').disabled = iLead || !can;
    $('custom').min = next; $('custom').max = me.points;
    if (!iLead && !can) say('You cannot afford a higher bid (capital ' + UI.fmt(me.points) + ').');
  } else if (m.phase === 'answering') {
    if (iLead) { b.classList.add('owner'); b.textContent = 'Bought at ' + UI.fmt(m.price) + '. Answer now! Correct earns ' + UI.fmt(2 * m.price) + ', wrong loses ' + UI.fmt(m.price) + '.'; }
    else b.textContent = 'Sold to ' + owner.name + ' at ' + UI.fmt(m.price) + '. Bidding is closed.';
  } else if (m.phase === 'result' && m.result) {
    const ans = m.result.answer ? ' Correct answer: ' + m.result.answer + '.' : '';
    if (m.result.skipped) b.textContent = 'Question skipped. No points changed.' + ans;
    else if (m.result.correct) { b.classList.add(m.result.teamId === myId ? 'win' : 'owner'); b.textContent = m.result.teamName + ' answered correctly: +' + UI.fmt(m.result.delta) + ' points.' + ans; }
    else { b.classList.add(m.result.teamId === myId ? 'lose' : 'owner'); b.textContent = m.result.teamName + ' answered incorrectly: −' + UI.fmt(-m.result.delta) + ' points.' + ans; }
  } else b.hidden = true;
  if (m.phase !== 'open' && m.phase !== 'bidding') say('');

  const rk = UI.rank(s);
  $('ranks').innerHTML = rk.map((t, i) => `<li class="${t.id === myId ? 'me' : ''}"><span class="pos">${i + 1}</span><span>${UI.esc(t.name)}</span><span class="pts">${UI.fmt(t.points)}</span></li>`).join('');
}

function tick() {
  const s = Store.state(); if (!s || !myId || !s.teams.find(t => t.id === myId)) return;
  const t = Store.secondsLeft(), m = s.market, w = $('clockwrap');
  if (!t) { w.hidden = true; return; }
  w.hidden = false;
  const secs = Math.ceil(t.left); let label, frac = t.left / t.total;
  if (m.phase === 'open') { if (m.price <= s.settings.floor) { label = 'Price is at the floor'; frac = 0; } else label = 'Next price drop in ' + secs + 's'; }
  else if (m.phase === 'bidding') label = 'Market closes in ' + secs + 's unless someone outbids';
  else label = t.left > 0 ? 'Time to answer: ' + secs + 's' : "Time's up";
  $('clocklabel').textContent = label; $('barfill').style.width = (frac * 100) + '%';
  $('bar').classList.toggle('warn', m.phase !== 'open' && t.left <= 5);
}

Store.subscribe(render);
setInterval(tick, 150);
</script>
</body>
</html>
